<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruma Café</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      background: #26382E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: repeating-linear-gradient(
        45deg, rgba(191,217,195,.04) 0, rgba(191,217,195,.04) 1px,
        transparent 0, transparent 50%);
      background-size: 24px 24px;
    }

    /* Logo */
    .logo-area {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-area h1 {
      font-family: Georgia, serif;
      font-size: 42px;
      color: #F5F1E9;
      letter-spacing: .03em;
      margin-bottom: 6px;
    }
    .logo-area h1 span { color: #BFD9C3; }
    .logo-area p {
      font-size: 14px;
      color: #BFD9C3;
      opacity: .7;
    }

    /* Tarjetas */
    .cards {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      background: #F5F1E9;
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      width: 260px;
      transition: transform .2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card-icon { font-size: 52px; margin-bottom: 16px; }
    .card h2 {
      font-size: 18px;
      font-weight: 700;
      color: #2C1B0E;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 13px;
      color: #4E342E;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-publico { background: #BFD9C3; color: #26382E; }
    .btn-admin   { background: #26382E; color: #F5F1E9; border: 2px solid #BFD9C3; }

    /* Footer */
    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: rgba(191,217,195,.5);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .logo-area h1 { font-size: 32px; }
      .cards { flex-direction: column; align-items: center; }
      .card { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo-area">
    <h1>☕ Bruma <span>Café</span></h1>
    <p>Bienvenido — ¿a dónde quieres ir?</p>
  </div>

  <!-- Dos tarjetas -->
  <div class="cards">

    <div class="card">
      <div class="card-icon">🌐</div>
      <h2>Sitio público</h2>
      <p>Explora nuestra carta, promociones y más</p>
      <a href="index.html" class="btn btn-publico">Ver el sitio</a>
    </div>

    <div class="card">
      <div class="card-icon">🔒</div>
      <h2>Panel del personal</h2>
      <p>Acceso exclusivo para el equipo de Bruma Café</p>
      <a href="sistema/login.html" class="btn btn-admin">Ingresar al sistema</a>
    </div>

  </div>

  <div class="footer">© 2026 Bruma Café</div>

</body>
</html>
