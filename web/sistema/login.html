<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruma Café — Ingresar</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-wrap">

    <div class="login-left">
        <img src="../Imagenes/LOGO2.png" alt="Logo Bruma Café" class="login-logo-img">
      <h1>Bruma <span>Café</span></h1>
      <div class="login-divider"></div>
      <p>Panel de administración del personal. Ingresa con tu usuario y contraseña para continuar.</p>
    </div>

    <div class="login-right">
      <h2>Ingresa tu cuenta</h2>
      <p>Bienvenido de nuevo.</p>

      <div class="login-error" id="error-msg">Usuario o contraseña incorrectos.</div>

      <div class="login-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Tu nombre de usuario">
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="login-btn" onclick="ingresar()">Ingresar al sistema</button>

      <div class="login-back">
        <a href="../index.html">← Volver al sitio público</a>
      </div>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    if (getToken()) window.location.href = 'dashboard.html';
    async function ingresar() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');
      errorDiv.style.display = 'none';
      if (!username || !password) {
        errorDiv.textContent = 'Completa todos los campos.';
        errorDiv.style.display = 'block';
        return;
      }
      try {
        const data = await login(username, password);
        setToken(data.token);
        const payload = JSON.parse(atob(data.token.split('.')[1]));
        setRol(payload.rol || 'CAJERO');
        setUsuario(payload.sub || username);
        window.location.href = 'dashboard.html';
      } catch(e) {
        errorDiv.textContent = e.message;
        errorDiv.style.display = 'block';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') ingresar(); });
  </script>
</body>
</html>
